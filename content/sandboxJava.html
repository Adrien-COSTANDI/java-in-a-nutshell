<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Java Sandbox</title>
  <style>
    /* ============================================================
       Thème (couleurs de la page, hors éditeur)
       ============================================================ */
    :root {
      --bg: #fff;
      --panel: #f5f5f5;
      --border: #ababab;
      --text: #262626;
      --accent: #007acc;
      --accent-hover: #1a8cd8;
      --ok: #4ec9b0;
      --err: #f14c4c;
      --neutral: #415b79;
    }

    body.dark {
      --bg: #1e1e1e;
      --panel: #252526;
      --border: #3c3c3c;
      --text: #d4d4d4;
      --neutral: #6e90a1;
    }

    * {
      box-sizing: border-box;
      transition: background 0.15s ease, color 0.15s ease;
    }

    /* ============================================================
       Layout général
       ============================================================ */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ============================================================
       Header (titre, toggles, bouton Run)
       ============================================================ */
    header {
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .toggle-details,
    .toggle-theme {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .toggle-details input,
    .toggle-theme input {
      cursor: pointer;
    }

    button#run {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button#run:hover {
      background: var(--accent-hover);
    }

    button#run:disabled {
      background: #555;
      cursor: not-allowed;
    }

    /* ============================================================
       Panneaux Code / Résultat + séparateur redimensionnable
       ============================================================ */
    .pane {
      display: flex;
      flex-direction: column;
      min-width: 120px;
      min-height: 0;
      overflow: hidden;
    }

    #pane-code {
      flex: 0 0 50%;
    }

    #pane-output {
      flex: 1 1 auto;
    }

    .pane-label {
      padding: 6px 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #888;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .resizer {
      flex: 0 0 6px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      cursor: col-resize;
      position: relative;
      z-index: 10;
    }

    .resizer:hover,
    .resizer.dragging {
      background: var(--accent);
    }

    body.resizing {
      cursor: col-resize;
      user-select: none;
    }

    body.resizing iframe,
    body.resizing #editor {
      pointer-events: none;
    }

    /* ============================================================
       Éditeur CodeMirror
       ============================================================ */
    #editor {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* CodeMirror doit occuper toute la hauteur disponible et scroller en
       interne, plutôt que de pousser la page vers le bas quand le code
       s'allonge. */
    #editor .cm-editor {
      height: 100%;
    }

    #editor .cm-scroller {
      overflow: auto;
    }

    /* Couleur des annotations Java (@Override, etc.), ajoutée via un
       ViewPlugin car non couverte nativement par le lexer CodeMirror. */
    span.cm-java-annotation,
    span.cm-java-annotation span {
      color: #808000;
    }

    body.dark span.cm-java-annotation,
    body.dark span.cm-java-annotation span {
      color: #bbb529;
    }

    /* ============================================================
       Zone de résultat
       ============================================================ */
    #output {
      flex: 1;
      overflow: auto;
      padding: 6px 12px;
      background: var(--bg);
      color: var(--text);
      font-family: Consolas, Monaco, monospace;
      font-size: 13.5px;
      word-break: break-word;
    }

    .status-header {
      font-size: 12px;
      padding: 4px 0;
      color: #888;
    }

    .val-text {
      padding: 4px 0;
    }

    .item-separator {
      border-top: 1px dashed var(--border);
      margin: 4px 0;
    }

    .status-VALID {
      color: var(--ok);
    }

    .status-NEUTRAL {
      color: var(--neutral);
    }

    .status-error,
    .status-ERROR {
      color: var(--err);
    }

    .out-text {
      color: var(--text);
      padding: 4px 0;
      margin: 0;
      display: block;
      unicode-bidi: isolate;
      white-space: pre;
      margin-inline: 0px;
    }

    .exc-text {
      color: var(--err);
      padding: 4px 0;
    }

    /* ============================================================
       Footer
       ============================================================ */
    footer {
      padding: 4px 16px;
      font-size: 11px;
      color: #666;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <header>
    <h1>Java Sandbox — dev.java</h1>
    <label class="toggle-theme">
      <input type="checkbox" id="themeToggle">
      Mode sombre
    </label>
    <label class="toggle-details">
      <input type="checkbox" id="detailsToggle">
      Mode détails
    </label>
    <button id="run">▶ Run (Ctrl+Enter)</button>
  </header>

  <main>
    <div class="pane" id="pane-code">
      <div class="pane-label">Code</div>
      <div id="editor"></div>
    </div>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" title="Glisser pour redimensionner">
    </div>
    <div class="pane" id="pane-output">
      <div class="pane-label">Résultat</div>
      <div id="output"></div>
    </div>
  </main>

  <footer>
    API: bxl7iq6fgjx6zcfh5pzsrhqqoe.apigateway.us-ashburn-1.oci.customer-oci.com — cette page appelle un service tiers
    non-officiel ; si le CORS bloque la requête, il faudra passer par un proxy.
  </footer>

  <script type="module">
    import { EditorView, basicSetup } from "https://esm.sh/codemirror";
    import { EditorState, Compartment } from "https://esm.sh/@codemirror/state";
    import { java } from "https://esm.sh/@codemirror/lang-java";
    import { createTheme } from "https://esm.sh/@uiw/codemirror-themes";
    import { tags as t } from "https://esm.sh/@lezer/highlight";
    import { Decoration, ViewPlugin, keymap } from "https://esm.sh/@codemirror/view";
    import { syntaxTree } from "https://esm.sh/@codemirror/language";
    import { indentWithTab } from "https://esm.sh/@codemirror/commands";
    import { encode, decode } from 'https://cdn.jsdelivr.net/npm/js-base64@3.9.2/base64.mjs';

    // ============================================================
    // Configuration
    // ============================================================
    const API_URL = "http://localhost:8787";

    const DEFAULT_CODE = `class Test {

  @Override
  public String toString() {
    return "Hello Java!";
  }
}

var t = new Test();
IO.println(t);`;

    const EDITOR_FONT_FAMILY = '"JetBrains Mono", Consolas, monospace';
    const EDITOR_FONT_SIZE = "14px";

    // ============================================================
    // Références DOM
    // ============================================================
    const outputEl = document.getElementById("output");
    const runBtn = document.getElementById("run");
    const detailsToggle = document.getElementById("detailsToggle");
    const themeToggle = document.getElementById("themeToggle");
    const resizer = document.getElementById("resizer");
    const paneCode = document.getElementById("pane-code");
    const mainEl = document.querySelector("main");

    // ============================================================
    // Utilitaires : encodage / échappement
    // ============================================================
    function asciiToBase64(str) {
      return encode(str);
    }

    function base64ToAscii(str) {
      return decode(str);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ============================================================
    // Thèmes CodeMirror — un seul générateur, deux palettes
    // (clair inspiré d'IntelliJ IDEA, sombre inspiré de Darcula)
    // ============================================================
    const LIGHT_PALETTE = {
      background: "#ffffff",
      foreground: "#000000",
      caret: "#000000",
      selection: "#ccd0df",
      selectionMatch: "#dbeeff",
      lineHighlight: "#f7f7f71a",
      gutterBackground: "#fafafa",
      gutterForeground: "#999999",
      gutterBorder: "#e5e5e5",
      comment: "#808080",
      keyword: "#0033B3",
      className: "#000000",
      classDefinition: "#267F99",
      function: "#00627A",
      variable: "#000000",
      variableDefinition: "#871094",
      property: "#871094",
      constant: "#660E7A",
      annotation: "#808000",
      string: "#067D17",
      number: "#1750EB",
    };

    const DARK_PALETTE = {
      background: "#1e1e1e",
      foreground: "#d4d4d4",
      caret: "#ffffff",
      selection: "#264f78",
      selectionMatch: "#3a3d41",
      lineHighlight: "#2a2d2e1a",
      gutterBackground: "#1e1e1e",
      gutterForeground: "#858585",
      gutterBorder: "#3c3c3c",
      comment: "#808080",
      keyword: "#cc7832",
      className: "#ffffff",
      classDefinition: "#4ec9b0",
      function: "#ffc66d",
      variable: "#d4d4d4",
      variableDefinition: "#9876aa",
      property: "#9876aa",
      constant: "#9876aa",
      annotation: "#bbb529",
      string: "#6a8759",
      number: "#6897bb",
    };

    function buildJavaTheme(mode, colors) {
      return createTheme({
        theme: mode,
        settings: {
          background: colors.background,
          foreground: colors.foreground,
          caret: colors.caret,
          selection: colors.selection,
          selectionMatch: colors.selectionMatch,
          lineHighlight: colors.lineHighlight,
          gutterBackground: colors.gutterBackground,
          gutterForeground: colors.gutterForeground,
          gutterBorder: colors.gutterBorder,
          fontFamily: EDITOR_FONT_FAMILY,
          fontSize: EDITOR_FONT_SIZE,
        },
        styles: [
          { tag: t.comment, color: colors.comment, fontStyle: "italic" },
          { tag: [t.keyword, t.controlKeyword, t.moduleKeyword], color: colors.keyword },
          { tag: [t.typeName, t.className], color: colors.className },
          { tag: t.definition(t.typeName), color: colors.classDefinition },
          { tag: [t.function(t.variableName), t.function(t.propertyName)], color: colors.function },
          { tag: t.variableName, color: colors.variable },
          { tag: t.definition(t.variableName), color: colors.variableDefinition },
          { tag: t.propertyName, color: colors.property },
          { tag: t.constant(t.variableName), color: colors.constant },
          { tag: t.annotation, color: colors.annotation },
          { tag: [t.string, t.special(t.string)], color: colors.string },
          { tag: [t.number, t.integer, t.float], color: colors.number },
          { tag: [t.bool, t.null], color: colors.keyword },
          { tag: [t.operator, t.punctuation, t.separator], color: colors.foreground },
          { tag: [t.bracket, t.paren, t.squareBracket, t.brace], color: colors.foreground },
        ],
      });
    }

    const intellijLight = buildJavaTheme("light", LIGHT_PALETTE);
    const intellijDark = buildJavaTheme("dark", DARK_PALETTE);

    // Compartment pour permettre de changer de thème à chaud, sans recréer l'éditeur.
    const themeCompartment = new Compartment();

    // ============================================================
    // Coloration des annotations Java (@Override, @Test, ...)
    // ============================================================
    const annotationMark = Decoration.mark({ class: "cm-java-annotation" });

    const annotationPlugin = ViewPlugin.fromClass(class {
      constructor(view) {
        this.decorations = this.build(view);
      }
      update(update) {
        if (update.docChanged || update.viewportChanged) {
          this.decorations = this.build(update.view);
        }
      }
      build(view) {
        const marks = [];
        syntaxTree(view.state).iterate({
          enter(node) {
            if (node.name === "MarkerAnnotation") {
              marks.push(annotationMark.range(node.from, node.to));
            }
          }
        });
        return Decoration.set(marks);
      }
    }, {
      decorations: v => v.decorations
    });

    // ============================================================
    // Initialisation de l'éditeur
    // ============================================================
    function readInitialCode() {
      const params = new URLSearchParams(window.location.search);
      const snippet = params.get("snippet");
      return snippet ? base64ToAscii(snippet) : DEFAULT_CODE;
    }

    const editor = new EditorView({
      state: EditorState.create({
        doc: readInitialCode(),
        extensions: [
          java(),
          themeCompartment.of(intellijLight),
          annotationPlugin,
          keymap.of([
            indentWithTab,
            {
              key: "Mod-Enter",
              run: () => {
                runCode();
                return true;
              }
            },
          ]),
          basicSetup,
        ]
      }),
      parent: document.getElementById("editor")
    });

    // ============================================================
    // Exécution du code via le proxy local (voir proxy.js)
    // ============================================================

    // Conserve la dernière réponse reçue pour pouvoir re-rendre
    // instantanément quand on bascule le mode détails, sans relancer le code.
    let lastData = null;

    async function runCode() {
      const source = editor.state.doc.toString();
      if (!source.trim()) return;

      runBtn.disabled = true;
      runBtn.textContent = "⏳ Exécution...";
      outputEl.innerHTML = "";
      lastData = null;

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
            "Accept": "*/*"
          },
          body: JSON.stringify({
            option: "na",
            prefixId: "",
            snippet: asciiToBase64(source)
          })
        });

        if (!resp.ok) {
          outputEl.innerHTML = `<span class="exc-text">Erreur HTTP ${resp.status}: ${escapeHtml(resp.statusText)}</span>`;
          return;
        }

        const data = await resp.json();
        lastData = data;
        render(data);

      } catch (err) {
        outputEl.innerHTML = `<span class="exc-text">Échec de la requête : ${escapeHtml(err.message)}\n\nCeci est probablement dû à une restriction CORS du serveur (il n'autorise peut-être que l'origine https://dev.java). Il faudra passer par un proxy si le problème persiste.</span>`;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "▶ Run (Ctrl+Enter)";
      }
    }

    // ------------------------------------------------------------
    // Rendu du résultat
    // ------------------------------------------------------------

    // Mode simple : seule la sortie brute (item.out) de chaque item est affichée.
    function renderSimple(data) {
      if (!Array.isArray(data.body)) return "";
      return data.body
        .filter(item => item.out)
        .map(item => `<div class="out-text">${escapeHtml(item.out)}</div>`)
        .join("");
    }

    // Un item de détail : en-tête (ligne/statut/type), puis la valeur de
    // l'expression (si elle en renvoie une), puis un séparateur, puis la
    // sortie standard — dans cet ordre, pour garder la cohérence entre
    // chaque ligne et sa propre valeur.
    function renderDetailedItem(item) {
      const statusClass = item.status === "VALID" ? "status-VALID" : item.status === "RECOVERABLE_NOT_DEFINED" || item.status === "RECOVERABLE_DEFINED" ? "status-NEUTRAL" : "status-ERROR";
      const lineRange = escapeHtml(String(item.codeLinesRange || item.lne || ""));

      let html = `<div class="status-header">Ligne(s) ${lineRange} — <span class="${statusClass}">${escapeHtml(item.status || "")}</span>`;
      if (item.knd) html += ` (${escapeHtml(item.knd)})`;
      html += `</div>`;

      if (item.val) {
        html += `<div class="val-text">=&gt; ${escapeHtml(item.val)}</div>`;
      }
      if (item.out) {
        html += `<div class="out-text">${escapeHtml(item.out)}</div>`;
      }
      if (item.exc) {
        html += `<div class="exc-text">Exception levée</div>`;
      }
      html += `<div class="item-separator"></div>`;

      return html;
    }

    function renderDetailed(data) {
      let html = "";

      if (data.errorMessage) {
        html += `<div class="exc-text">${escapeHtml(data.errorMessage)}</div>`;
      }

      if (!Array.isArray(data.body) || data.body.length === 0) {
        if (!data.errorMessage) {
          html += `<div>(aucune sortie)</div>`;
        }
        return html;
      }

      return html + data.body.map(renderDetailedItem).join("");
    }

    function render(data) {
      outputEl.innerHTML = detailsToggle.checked ? renderDetailed(data) : renderSimple(data);
    }

    // ============================================================
    // Toggle : mode sombre (page + éditeur en même temps)
    // ============================================================
    function setupThemeToggle() {
      themeToggle.addEventListener("change", () => {
        const isDark = themeToggle.checked;
        document.body.classList.toggle("dark", isDark);
        editor.dispatch({
          effects: themeCompartment.reconfigure(isDark ? intellijDark : intellijLight)
        });
      });
    }

    // ============================================================
    // Toggle : mode détails
    // Rebascule instantanément l'affichage entre les deux modes,
    // sans avoir besoin de relancer le code.
    // ============================================================
    function setupDetailsToggle() {
      detailsToggle.addEventListener("change", () => {
        if (lastData) render(lastData);
      });
    }

    // ============================================================
    // Séparateur draggable entre le code et le résultat
    // ============================================================
    function setupResizer() {
      const MIN_PANE_WIDTH = 120;
      let dragging = false;
      let startX = 0;
      let startWidth = 0;

      resizer.addEventListener("pointerdown", (e) => {
        dragging = true;
        startX = e.clientX;
        startWidth = paneCode.getBoundingClientRect().width;
        resizer.classList.add("dragging");
        document.body.classList.add("resizing");
        resizer.setPointerCapture(e.pointerId);
      });

      resizer.addEventListener("pointermove", (e) => {
        if (!dragging) return;

        const delta = e.clientX - startX;
        const mainWidth = mainEl.getBoundingClientRect().width;
        const resizerWidth = resizer.getBoundingClientRect().width;
        const maxWidth = mainWidth - resizerWidth - MIN_PANE_WIDTH;

        const newWidth = Math.max(MIN_PANE_WIDTH, Math.min(startWidth + delta, maxWidth));
        paneCode.style.flex = `0 0 ${newWidth}px`;
      });

      function stopDragging(e) {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove("dragging");
        document.body.classList.remove("resizing");
        if (resizer.hasPointerCapture(e.pointerId)) {
          resizer.releasePointerCapture(e.pointerId);
        }
      }

      resizer.addEventListener("pointerup", stopDragging);
      resizer.addEventListener("pointercancel", stopDragging);
    }

    // ============================================================
    // Câblage final
    // ============================================================
    runBtn.addEventListener("click", runCode);
    setupThemeToggle();
    setupDetailsToggle();
    setupResizer();

    window.editor = editor; // pratique pour du débogage depuis la console
  </script>

</body>

</html>
